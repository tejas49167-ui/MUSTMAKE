<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="../js/core/change_backend_url.js"></script>
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.jpeg">

    <title>Login | MUSTMAKE</title>

    <script src="../js/shared/theme.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

   <header class="topbar">
    <div class="logo">MUSTMAKE</div>
   </header>
  
    <main class="auth-container">

        <div class="auth-content">
                   

            <form id="loginForm">

                <div class="form-group">
                    <label id="loginLabel" for="login">Username or Email</label>
                    <input
                        type="text"
                        id="login"
                        placeholder="Enter username or email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group login-method-group">
                  
                    <label id="passwordLabel" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                  <div class="login-method-toggle" role="group" aria-label="Sign-in method">
                        <button
                            type="button"
                            class="is-active"
                            data-login-mode="password"
                            aria-pressed="true"
                        >
                            Password
                        </button>
                        <button
                            type="button"
                            data-login-mode="otp"
                            aria-pressed="false"
                        >
                            Email code
                        </button>
                    </div>


                <button type="submit" id="loginSubmitButton" class="main-button">Login</button>

            </form>

            <form id="otpLoginVerifyForm" class="otp-login-form" hidden>

                <h1>Enter the code</h1>

                <p class="auth-subtitle otp-login-subtitle">
                    We sent a 6-digit verification code to
                    <strong id="otpLoginEmailLabel"></strong>
                </p>

                <div class="form-group">
                    <label for="loginOtp">Verification code</label>

                    <input
                        type="text"
                        id="loginOtp"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        
                        required
                    >

                </div>

                <button type="submit" class="main-button">
                    Verify and sign in
                </button>

                <p
                    id="otpLoginStatus"
                    class="auth-message otp-login-status"
                    role="status"
                    aria-live="polite"
                    hidden
                ></p>

                <div class="otp-resend-block">
                    <p id="loginOtpResendStatus" class="auth-subtitle otp-resend-prompt">
                        Didn’t receive the code?
                    </p>
                    <div class="otp-resend-actions">
                        <button
                            type="button"
                            id="loginOtpResend"
                            class="otp-inline-link"
                        >
                            Resend code
                        </button>
                        <span aria-hidden="true">•</span>
                        <button
                            type="button"
                            id="changeOtpLoginEmail"
                            class="otp-inline-link"
                        >
                            Change email
                        </button>
                    </div>
                </div>

            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <a
                id="googleLoginLink"
                href="https://mustmakebackend.vercel.app/api/auth/google"
                class="google-button google-oauth-button"
                target="_blank"
                rel="noopener"
            >
                <svg class="google-oauth-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                    <path fill="#4285F4" d="M43.611 20.083H42V20H24v8h11.303C33.651 32.657 29.223 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                    <path fill="#EA4335" d="M6.306 14.691l6.571 4.819C14.459 15.108 18.89 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                    <path fill="#FBBC05" d="M4 24c0 4.044 1.055 7.753 2.867 10.97l6.571-5.204C12.522 28.055 12 26.088 12 24s.522-4.055 1.438-5.766L6.867 13.03C5.055 16.247 4 19.956 4 24z"/>
                    <path fill="#34A853" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.553 35.091 26.877 36 24 36c-5.222 0-9.655-3.334-11.276-7.987l-6.571 5.091C9.656 39.663 16.318 44 24 44z"/>
                </svg>
                Continue with Google
            </a>

            <p
                id="loginMessage"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></p>

            <p class="auth-footer">
                New to MUSTMAKE?
                <a id="signupLink" href="signup.html">
                    Create account
                </a>
            </p>

        </div>

    </main>

    <script src="../js/shared/auth-redirect.js"></script>
    <script src="../js/features/auth/auth.js"></script>

</body>

</html>
