<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            const isAuthenticated = Boolean(
                localStorage.getItem("token") &&
                JSON.parse(localStorage.getItem("user") || "null")
            );
            if (isAuthenticated) window.location.replace("/pages/index.html");
            else window.location.replace("/blog#exercises");
        } catch {
            window.location.replace("/blog#exercises");
        }
    </script>
    <script src="/js/core/change_backend_url.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.jpeg">
    <title>Exercises | MUSTMAKE</title>
    <script src="/js/shared/theme.js"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="app-page">
    <div id="navbar"></div>

    <main class="container exercise-library-page">
        <section class="exercise-library" aria-labelledby="exerciseLibraryTitle">

            <div id="exerciseGrid" class="exercise-library-groups" aria-live="polite"></div>
        </section>
    </main>

    <script src="/js/shared/navbar.js"></script>
    <script src="/js/features/exercises/exercise-library.js"></script>
</body>
</html>
