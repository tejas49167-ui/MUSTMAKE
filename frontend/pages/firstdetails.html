<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/core/change_backend_url.js"></script>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <title>Set Up Your Profile | MUSTMAKE</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/style-after.css">
    
    <link rel="stylesheet" href="/assets/css/toast.css">
</head>

<body id="firstSetupPage">
    <div id="navbar"></div>
    <div class="setup-shell">
        <main class="setup-layout">
           
                <p class="intro-copy">
                    A few details help make your profile feel like you. You can update them any time.
                </p>
         

            <section>
                <div class="card-heading">
                    <p id="setupFormTitle">Your name is required. The other profile details are optional.</p>
                
                </div>

                <form id="profileForm" class="setup-form">

                    <div class="setup-field">
                        <label for="name">Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            maxlength="100"
                            autocomplete="name"
                            placeholder="Your name"
                            required
                        >
                    </div>

<div class="setup-field">
    <label for="age">
        Age
    </label>

    <input
        type="number"
        id="age"
        name="age"
        min="0"
        max="120"
        step="1"
        inputmode="numeric"
        placeholder="e.g. 28"
        aria-describedby="ageHint"
    >

    <small id="ageHint" class="field-hint">
        We like to know your age for customized suggestions.
    </small>
</div>
                    <div class="metrics-grid">
                        <div class="setup-field">
                            <label for="height">Height </label>
                            <input type="number" id="height" min="50" max="300" inputmode="decimal" placeholder="e.g. 175 cm">
                        </div>

                        <div class="setup-field">
                            <label for="weight">Weight </label>
                            <input type="number" id="weight" min="20" max="500" step="0.1" inputmode="decimal" placeholder="e.g. 68 kg">
                        </div>
                    </div>

                    <div class="setup-field photo-field">
                        <label for="profilePicture">Profile photo </label>
                        <div class="photo-control">
                            <div class="photo-preview-wrap">
                                <svg class="photo-placeholder" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.5" />
                                    <path d="M5.5 20c.5-3.3 2.7-5 6.5-5s6 1.7 6.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                                </svg>
                                <img id="photoPreview" src="" alt="Profile photo preview" class="profile-photo">
                            </div>
                            <div class="photo-picker">
                                <input type="file" id="profilePicture" accept="image/jpeg,image/png,image/webp" aria-describedby="photoHint">
                                <small id="photoHint">JPG, PNG or WebP · up to 2 MB</small>
                            </div>
                        </div>
                    </div>

                    <details class="socials-details">
                        <summary>
                            <span>Social links </span>
                        </summary>
                        <div class="socials-content">
                            <div class="socials-grid social-links-field">
                                <div id="social-links-container" class="social-links-container"></div>
                                <button type="button" id="add-social-link">+ Add Link</button>
                                <small id="social-links-count" aria-live="polite"></small>
                            </div>
                        </div>
                    </details>

                    <div class="consent-field">
                        <label class="consent-label" for="legalConsent">
                            <input type="checkbox" id="legalConsent" name="legalConsent" required>
                            <span>
                                I'm creating account in mustmake as im aware of
                                <a href="/about#privacy-policy">Privacy Policy</a>
                                and
                                <a href="/about#terms-and-conditions">Terms &amp; Conditions</a>.
                            </span>
                        </label>
                    </div>

                    <button type="submit" class="main-button save-button" disabled>
                        Create account 
                        <svg class="save-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                            <path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </form>

            </section>
        </main>
    </div>

    <script src="/js/shared/toast.js"></script>
    <script src="/js/shared/navbar.js"></script>
    <script src="/js/shared/auth-redirect.js"></script>
    <script src="/js/features/profile/edit-profile.js"></script>
</body>

</html>
