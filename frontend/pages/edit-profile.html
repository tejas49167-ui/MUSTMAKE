<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/core/change_backend_url.js"></script>
        <link rel="icon" type="image/png" href="/assets/images/favicon.png">

    <title>Edit details | MUSTMAKE</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/toast.css">
</head>

<body>

    <div id="navbar"></div>

    <main class="profile-container">

        <section class="profile-card">


            <form id="profileForm">

                <div class="form-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        min="0"
                        max="120"
                        step="1"
                        inputmode="numeric"
                        placeholder="U'r age"
                    >
                </div>

                <div class="form-group">
                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" min="50" max="300" placeholder="U'r height">
                </div>

                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" min="20" max="500" step="0.1" placeholder="U'r weight">
                </div>

                <button type="submit" class="main-button">Save details</button>

            </form>

        <small>Any authenticated user can see this data </small>

        </section>

    </main>

    <script src="/js/shared/toast.js"></script>
    <script src="/js/shared/navbar.js"></script>
    <script src="/js/features/profile/edit-profile.js"></script>

</body>

</html>
