<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/core/change_backend_url.js"></script>
        <link rel="icon" type="image/x-icon" href="/assets/images/favicon.jpeg">

    <title>Profile | MUSTMAKE</title>
    <script src="/js/shared/theme.js"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
    <div id="navbar"></div>

    <main class="profile-container">
        <section >
            <div class="profile-photo-container">
                <img id="profilePhoto" src="" alt="Profile Photo" class="profile-photo" decoding="async">
            </div>

            <h1 id="profileName">Loading...</h1>
            <p id="profileUsername" class="profile-username">@username</p>

            <p id="profileIs" hidden>is</p>
            <div class="profile-details" id="profileDetails" hidden>
                <div class="social-sections" id="profileAgeSection" hidden>
                    <strong id="profileAge"></strong>
                    <span>years old</span>
                </div>
                <div class="social-sections" id="profileHeightSection" hidden>
                    <strong id="profileHeight"></strong>
                    <span>cm tall</span>
                </div>
                <div class="social-sections" id="profileWeightSection" hidden>
                    <strong id="profileWeight"></strong>
                    <span>kg</span>
                </div>
            </div>

            <div class="social-section">
                <h2>Socials</h2>
                <div id="socialLinks" class="social-links">Loading...</div>
            </div>

            <a href="/edit-profile" class="main-button">Edit Profile</a>
        </section>

        <button id="logoutButton" class="logoutBtn" type="button">Logout</button>

        <section class="public-workout-history">
            <div id="history">Loading...</div>
        </section>
    </main>

    <script src="/js/shared/navbar.js"></script>
    <script src="/js/features/workouts/script.js"></script>
    <script src="/js/features/profile/profile.js"></script>
</body>

</html>
