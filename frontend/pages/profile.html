<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/core/change_backend_url.js"></script>
        <link rel="icon" type="image/png" href="/assets/images/favicon.png">

    <title>Profile | MUSTMAKE</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/profiles.css">
    <link rel="stylesheet" href="/assets/css/toast.css">
</head>

<body>
    <div id="navbar"></div>

    <main class="profile-container">
        <section >
            <div class="profile-photo-container">
                <button type="button" id="profilePhotoButton" class="profile-photo-button" aria-label="View profile photo" disabled>
                    <img id="profilePhoto" src="" alt="Profile Photo" class="profile-photo" decoding="async">
                </button>
            </div>

            <h1 id="profileName">
                <button type="button" id="profileNameEdit" class="profile-name-trigger" aria-label="Edit your name" disabled>Hello</button>
            </h1>
            <p id="profileUsername" class="profile-username">@username</p>

            <p id="profileIs" hidden>is</p>
            <div class="profile-details" id="profileDetails" hidden>
                <div class="social-sections" id="profileAgeSection" hidden>
                    <button type="button" class="profile-metric-value" data-profile-metric="age" aria-label="Edit age" disabled>
                        <strong id="profileAge"></strong>
                    </button>
                    <span>years old</span>
                </div>
                <div class="social-sections" id="profileHeightSection" hidden>
                    <button type="button" class="profile-metric-value" data-profile-metric="height" aria-label="Edit height" disabled>
                        <strong id="profileHeight"></strong>
                    </button>
                    <span>cm tall</span>
                </div>
                <div class="social-sections" id="profileWeightSection" hidden>
                    <button type="button" class="profile-metric-value" data-profile-metric="weight" aria-label="Edit weight" disabled>
                        <strong id="profileWeight"></strong>
                    </button>
                    <span>kg</span>
                </div>
            </div>

            <div class="social-section">
                <div class="social-section-heading">
                    <h2>Socials</h2>
                    <button type="button" id="addProfileSocial" class="social-add-button" aria-label="Add social link" title="Add social link" disabled>
                        <span aria-hidden="true">+</span>
                    </button>
                </div>
                <div id="socialLinks" class="social-links"></div>
            </div>

        </section>


        <section class="public-workout-history">
            <div id="history">You can and you must</div>
        </section>
    </main>

    <div id="profilePhotoDialog" class="profile-interaction-overlay" hidden>
        <section class="profile-photo-dialog" role="dialog" aria-modal="true" aria-labelledby="photoDialogTitle">
            <h2 id="photoDialogTitle" class="visually-hidden">Profile photo</h2>
            <div class="profile-photo-preview-wrap">
                <img id="profilePhotoPreview" class="profile-photo-preview" src="" alt="Selected profile photo preview">
                <button type="button" id="chooseProfilePhoto" class="photo-edit-button" aria-label="Choose a profile photo" title="Choose a profile photo">
                    <span aria-hidden="true">✎</span>
                </button>
            </div>
            <input type="file" id="profilePhotoInput" accept="image/jpeg,image/png,image/webp" hidden>
            <div class="profile-interaction-actions">
                <button type="button" id="saveProfilePhoto" class="main-button" disabled>Save</button>
            </div>
        </section>
    </div>

    <div id="socialDialog" class="profile-interaction-overlay" hidden>
        <section class="profile-social-dialog" role="dialog" aria-modal="true" aria-labelledby="socialDialogTitle">
            <h2 id="socialDialogTitle">Social links</h2>
            <div id="savedSocialLinks" class="saved-social-links" aria-label="Saved social links"></div>
            <input type="url" id="socialUrlInput" inputmode="url" autocomplete="url" placeholder="https://…">
            <div class="profile-interaction-actions">
                <button type="button" id="saveProfileSocial" class="main-button">Add link</button>
            </div>
        </section>
    </div>

    <div id="profileValueDialog" class="profile-interaction-overlay" hidden>
        <section class="profile-value-dialog" role="dialog" aria-modal="true" aria-labelledby="profileValueDialogTitle">
            <h2 id="profileValueDialogTitle">Change name</h2>
            <input id="profileValueInput" type="text" autocomplete="name" maxlength="100" required aria-label="Name">
            <p id="profileValueHint" class="profile-value-hint" hidden>Age increments every January. Clear it to remove it from your profile.</p>
            <div class="profile-interaction-actions">
                <button type="button" id="saveProfileValue" class="main-button">Change</button>
            </div>
        </section>
    </div>

    <script src="/js/shared/toast.js"></script>
    <script src="/js/shared/navbar.js"></script>
    <script src="/js/shared/workout-presentation.js"></script>
    <script src="/js/features/workouts/script.js"></script>
    <script src="/js/features/profile/profile.js"></script>
</body>

</html>
