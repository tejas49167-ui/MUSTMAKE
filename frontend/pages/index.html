<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="favicon.jpeg">

    <title>Today | Just Do It</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div id="navbar"></div>

    <main class="container">

        <section class="hero">
            <h1 id="todayDate">Loading...</h1>
            <p class="subtitle">
                There is only one thing in this universe
                that can beat me, that is me myself
            </p>
        </section>

        <section class="people-grid">
            <div class="person-card">
                <div class="person-top">
                    <div>
                        <h2 id="userName">Loading...</h2>
                        <p id="userUsername">@username</p>
                    </div>

                    <div class="streak">
                        <strong id="userStreak">0</strong>
                        <small>day streak</small>
                    </div>
                </div>

                <div class="workout-section">
                    <h3>Today's Workout</h3>
                    <div id="userWorkouts" class="workouts">Loading...</div>
                </div>
            </div>  
        </section>

        <section class="actions">
            <a href="add-workout.html" class="main-button">+ Add Workout</a>
            <a href="app.html" class="secondary-button">View History</a>
        </section>

    </main>

    <script src="../js/navbar.js"></script>
    <script src="../js/script.js"></script>

</body>

</html>
