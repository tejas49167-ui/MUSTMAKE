<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            const isAuthenticated = Boolean(
                localStorage.getItem("token") &&
                JSON.parse(localStorage.getItem("user") || "null")
            );
            if (!isAuthenticated) window.location.replace("/");
        } catch {
            window.location.replace("/");
        }
    </script>
    <script src="/js/core/change_backend_url.js"></script>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <title>Today | MUSTMAKE</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/toast.css">
</head>
<body class="app-page">
    <div id="navbar"></div>

    <main class="container">
        <section id="guestCta" class="today-guest" hidden>
            <section class="hero">
                <h1>Today</h1>
                <p class="subtitle">Log in to see your workouts and daily streak.</p>
            </section>
            <p class="auth-footer"><a href="/login">Sign in</a> · <a href="/signup">Create account</a></p>
        </section>


<!-- //normal -->
        <section id="personalDashboard" hidden>
            
            <div class="person-top">
                <div>
                    <h2 id="userName">...</h2>
                </div>
                <div class="streak">
                    <strong id="userStreak">0</strong>
                    <small>day streak</small>
                </div>
            </div>

            <section class="workout-section">
                <h3>Today</h3>
                <div id="userWorkouts" class="workouts">Keep working, it will make you feel good </div>
            </section>

          
        </section>
        <!-- //normal end  -->

        <section class="exercise-library-page">
            <section class="exercise-library" aria-labelledby="workoutChoiceTitle">
                <div class="library-heading"></div>
                <div id="exerciseGrid" class="exercise-library-groups" aria-live="polite"></div>
            </section>
        </section>
    </main>

    <script src="/js/shared/toast.js"></script>
    <script src="/js/shared/navbar.js"></script>
    <script src="/js/features/workouts/script.js"></script>
    <script src="/js/features/exercises/exercise-library.js"></script>
</body>
</html>
