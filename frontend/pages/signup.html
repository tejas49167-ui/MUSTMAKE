<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/core/change_backend_url.js"></script>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">

    <title>Sign Up | MUSTMAKE</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/toast.css">
</head>

<body>
    <div id="navbar"></div>

    <main class="auth-container">

        <div class="auth-content">

            <p class="auth-subtitle"></p>

            <form id="signupForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        minlength="3"
                        maxlength="30"
                        pattern="[A-Za-z0-9_]{3,30}"
                        placeholder="Choose a username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        maxlength="254"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrap">
                        <input
                            type="password"
                            id="password"
                            placeholder="At least 6 characters"
                            minlength="6"
                            required
                        >
                        <button type="button" class="password-visibility-toggle" data-password-toggle="password" aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                </div>

                <button type="submit" class="main-button">
                    Send verification code
                </button>

            </form>

            <form id="signupOtpForm" class="otp-login-form" hidden>

                <h1>Enter the code</h1>

                <p class="auth-subtitle otp-login-subtitle">
                    We sent a 6-digit verification code to
                    <strong id="signupOtpEmail"></strong>
                </p>

                <div class="form-group">
                    <label for="signupOtp">Verification code</label>

                    <input
                        type="text"
                        id="signupOtp"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        placeholder="6-digit code"
                        aria-describedby="signupResendStatus"
                        required
                    >
                </div>

                <button type="submit" class="main-button">
                    Verify email
                </button>

                <div class="otp-resend-block">
                    <p
                        id="signupResendStatus"
                        class="auth-subtitle otp-resend-prompt"
                        aria-live="polite"
                        hidden
                    ></p>
                    <div class="otp-resend-actions">
                        <button
                            type="button"
                            id="signupResend"
                            class="otp-inline-link"
                        >
                            Resend code
                        </button>
                        <span aria-hidden="true">•</span>
                        <button
                            type="button"
                            id="editSignupDetails"
                            class="otp-inline-link"
                        >
                            Change signup details
                        </button>
                    </div>
                </div>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a id="loginLink" href="/login">Login</a>
            </p>

        </div>

    </main>

    <script src="/js/shared/toast.js"></script>
    <script src="/js/shared/navbar.js"></script>
    <script src="/js/shared/auth-redirect.js"></script>
    <script src="/js/shared/password-visibility.js"></script>
    <script src="/js/features/auth/signup.js"></script>

</body>

</html>
