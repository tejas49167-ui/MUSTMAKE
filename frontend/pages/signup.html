<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Just Do It</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <h1>Just Do It</h1>
            <p class="auth-subtitle">Create your account.</p>

            <form id="signupForm">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" maxlength="100" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" placeholder="Choose a username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" maxlength="254" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
                </div>

                <button type="submit" class="main-button">Create Account</button>

            </form>

            <p id="signupMessage" class="auth-message"></p>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </main>

    <script src="../js/signup.js"></script>

</body>

</html>
