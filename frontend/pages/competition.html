<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/core/change_backend_url.js"></script>
        <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <title>Competition | MUSTMAKE</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/style-after.css">
    <link rel="stylesheet" href="/assets/css/toast.css">
</head>

<body>

    <div id="navbar"></div>

    <main class="container">

        <section class="competition-search-area" aria-label="Find people">
            <div class="search-control" id="peopleSearch">
                <button
                    class="search-trigger"
                    id="searchToggle"
                    type="button"
                    aria-label="Focus people search"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="10.8" cy="10.8" r="6.8"></circle>
                        <path d="m16 16 4.2 4.2"></path>
                    </svg>
                </button>
                <div class="search-overlay" id="peopleSearchOverlay">
                    <label class="visually-hidden" for="usernameSearch">Add people</label>
                    <input
                        type="search"
                        id="usernameSearch"
                        placeholder="Add people"
                        autocomplete="off"
                    >
                </div>
            </div>
            <div id="searchResults" class="competition-results" aria-live="polite"></div>
        </section>

        <section class="competition-people">
   
            <div id="competitionList" class="competition-grid">Work hard with good mindset</div>
        </section>

    </main>

    <script src="/js/shared/toast.js"></script>
    <script src="/js/shared/navbar.js"></script>
    <script src="/js/shared/workout-presentation.js"></script>
    <script src="/js/features/competition/competition.js"></script>

</body>

</html>
