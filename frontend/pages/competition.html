<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/core/change_backend_url.js"></script>
        <link rel="icon" type="image/x-icon" href="../assets/images/favicon.jpeg">
    <title>Competition | MUSTMAKE</title>
    <script src="../js/shared/theme.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <div id="navbar"></div>

    <main class="container">

        <section class="competition-search-area" aria-label="Find people">
            <div class="search-control" id="peopleSearch">
                <button
                    class="search-trigger"
                    id="searchToggle"
                    type="button"
                    aria-label="Focus people search"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="10.8" cy="10.8" r="6.8"></circle>
                        <path d="m16 16 4.2 4.2"></path>
                    </svg>
                </button>
                <div class="search-overlay" id="peopleSearchOverlay">
                    <label class="visually-hidden" for="usernameSearch">Search people</label>
                    <input
                        type="search"
                        id="usernameSearch"
                        placeholder="Search people"
                        autocomplete="off"
                    >
                </div>
            </div>
            <div id="searchResults" class="competition-results" aria-live="polite"></div>
        </section>

        <section class="competition-people">
            <h2>People you knew</h2>
            <div id="competitionList" class="competition-grid">Loading...</div>
        </section>

    </main>

    <script src="../js/shared/navbar.js"></script>
    <script src="../js/features/competition/competition.js"></script>

</body>

</html>
