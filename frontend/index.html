<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080a0f">
    <title>MUSTMAKE</title>

    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.jpeg">
    <link rel="preload" as="image" href="/assets/images/favicon.jpeg">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(
                    ellipse at 50% 42%,
                    hwb(210 24% 75% / 0.12),
                    transparent 42%
                ),
                oklab(13.441% 0 -0.00002);
            color: hwb(0 100% 0%);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .splash {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

      

     

        .logo {
            width: 70px;
            height: 70px;
            display: block;
            object-fit: contain;
            border-radius: 18px;
        }

        .wordmark {
            margin: 30px 0 0;
            padding-left: 0.19em;
            font-size: clamp(27px, 6vw, 34px);
            font-weight: 750;
            letter-spacing: 0.19em;
            line-height: 1.2;
            animation: text-enter 750ms ease 180ms both;
        }

        .tagline {
            margin: 12px 0 0;
            color: hsl(220, 2%, 51%);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.24em;
            line-height: 1.7;
            animation: text-enter 750ms ease 330ms both;
        }

        .loader {
            width: 116px;
            height: 2px;
            margin-top: 42px;
            overflow: hidden;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.1);
            animation: text-enter 650ms ease 400ms both;
        }

        .loader-bar {
            width: 40%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                90deg,rgba(205, 211, 221, 0.65)rgba(72, 72, 73, 0.65)rgba(72, 72, 73, 0.65)
                #141414,
                hsl(0, 0%, 0%)
            );
            animation: loading 1.65s cubic-bezier(.4, 0, .2, 1) forwards;
        }

        .status {
            margin-top: 17px;
            color: #626b7a;
            font-size: 11px;
            font-weight: 450;
            letter-spacing: 0.03em;
            animation: text-enter 650ms ease 480ms both;
        }

        .continue-link {
            margin-top: 24px;
            color: #aabbd7;
            font-size: 12px;
            text-decoration: none;
            transition: color 180ms ease;
        }

        .continue-link:hover,
        .continue-link:focus-visible {
            color: #ffffff;
        }

        

        @keyframes logo-enter {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.84);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes text-enter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

       

        @media (max-width: 480px) {
            
            .logo {
                width: 62px;
                height: 62px;
                border-radius: 16px;
            }

            .wordmark {
                margin-top: 27px;
            }

            .loader {
                margin-top: 36px;
            }
        }

        
    </style>
</head>

<body>
    <main class="splash">
        <div >
            <img
                class="logo"
                src="assets/images/favicon.jpeg"
                alt="MUSTMAKE logo"
                width="70"
                height="70"
                fetchpriority="high"
            >
        </div>

        <h1 class="wordmark">MUSTMAKE</h1>




        <a id="homeLink" class="continue-link" href="/pages/gst.html"></a>
    </main>

    <script>
        (() => {
            let isAuthenticated = false;

            try {
                isAuthenticated = Boolean(
                    localStorage.getItem("token") &&
                    JSON.parse(localStorage.getItem("user") || "null")
                );
            } catch {
                isAuthenticated = false;
            }

            const destination = isAuthenticated
                ? "/pages/index.html"
                : "/blog";

            const homeLink = document.getElementById("homeLink");
            homeLink.href = destination;

            const prefersReducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;

            const redirectDelay = prefersReducedMotion ? 200 : 1800;

            window.setTimeout(() => {
                window.location.replace(destination);
            }, redirectDelay);
        })();
    </script>
</body>
</html>
